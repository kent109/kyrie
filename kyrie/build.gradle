plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace "com.github.alexjlockwood.kyrie"
    compileSdk 37

    defaultConfig {
        minSdk 29
        targetSdk 35
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    publishing {
        singleVariant("release")
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.kent109'
                artifactId = 'kyrie'
                version = '1.0.0'
            }
        }
    }
}

dependencies {
    // Kotlin stdlib is added automatically by AGP 9 built-in Kotlin; declared here so the
    // library exposes it as an API dependency to consumers.
    api "org.jetbrains.kotlin:kotlin-stdlib:2.2.0"
    // TODO: depend on appcompat-resources v1.1.0 once it graduates from alpha
    implementation 'androidx.appcompat:appcompat:1.6.1'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}
